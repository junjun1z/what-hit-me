name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 1.12.2 (Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -Pmod_version="0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: whathitme-ci
          path: build/libs/whathitme-*.jar
          if-no-files-found: error

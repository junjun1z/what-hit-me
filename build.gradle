// Minecraft Forge 1.12.2 through RetroFuturaGradle (MCP names, reobfuscated to SRG for the release jar)
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version "${rfg_version}"
}

// Version: -Pmod_version=X.Y.Z > VERSION environment variable > 1.0.0
def cliVersion = gradle.startParameter.projectProperties['mod_version']
def envVersion = System.getenv('VERSION')
version = cliVersion ?: (envVersion ?: '1.0.0')
group = project.property('mod_group')
base { archivesName = 'whathitme' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Developer'
}

// Version constant for @Mod(version = ...)
def genDir = layout.buildDirectory.dir('generated/whmtags')
def genTags = tasks.register('generateTags') {
    def v = project.version.toString()
    inputs.property('version', v)
    outputs.dir(genDir)
    doLast {
        def f = new File(genDir.get().asFile, 'io/github/junjun1z/whathitme/Tags.java')
        f.parentFile.mkdirs()
        f.text = "package io.github.junjun1z.whathitme;\n\n/** Generated by the build. */\npublic final class Tags {\n    public static final String VERSION = \"${v}\";\n\n    private Tags() {}\n}\n"
    }
}

sourceSets {
    main {
        java {
            srcDir genDir
            // development self-test, only with -Pselftest (never in release jars)
            if (project.hasProperty('selftest')) {
                srcDir 'devtools/java'
                srcDir 'devtools/driver/java'
            }
        }
    }
}
tasks.named('compileJava') { dependsOn genTags }

def expandProps = [
    version        : project.version.toString(),
    mod_description: project.property('mod_description'),
    mod_homepage   : project.property('mod_homepage'),
    mod_authors    : project.property('mod_authors'),
]
processResources {
    inputs.properties(expandProps)
    def icon = file('docs/icon_128.png')
    if (icon.exists()) from(icon) { into 'assets/whathitme'; rename { 'icon.png' } }
    filesMatching('mcmod.info') { expand expandProps }
}

jar {
    from(file('LICENSE')) { rename { 'LICENSE_whathitme' } }
    manifest {
        attributes('Implementation-Title': 'What Hit Me?', 'Implementation-Version': project.version, 'Implementation-Vendor': 'junjun1z')
    }
}

// keep only the reobfuscated (production) jar in build/libs
tasks.named('jar') { destinationDirectory = layout.buildDirectory.dir('devlibs') }
tasks.named('reobfJar') { destinationDirectory = layout.buildDirectory.dir('libs') }

// Development only (-Pselftest): the test driver for "client without What Hit Me?" as its own jar
if (project.hasProperty('selftest')) {
    def driverJar = tasks.register('driverJar', Jar) {
        dependsOn 'reobfJar'
        archiveFileName = 'whmdriver-dev.jar'
        destinationDirectory = layout.buildDirectory.dir('devlibs')
        from({ zipTree(tasks.named('reobfJar').get().outputs.files.singleFile) }) { include 'io/github/junjun1z/whmdriver/**' }
    }
    tasks.named('assemble') { dependsOn driverJar }
}

// NeoForge 1.20.2+ through ModDevGradle (Mojang names in production: no reobfuscation)
apply plugin: 'net.neoforged.moddev'
apply from: rootProject.file('gradle/common.gradle')

neoForge {
    version = project.property('neoforge_version')
    runs {
        client { client() }
        server { server() }
    }
    mods {
        whathitme { sourceSet sourceSets.main }
    }
}

ext.whmProductionJar = 'jar'

dependencies {
    def extra = rootProject.file("gradle/deps-neoforge-${project.property('code_version')}.gradle")
    if (extra.exists()) apply from: extra, to: project
}

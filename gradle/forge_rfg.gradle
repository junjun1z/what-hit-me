// MinecraftForge 1.12.2 / 1.7.10 through RetroFuturaGradle (MCP names, reobfuscated to SRG for production). Nested legacy/ build.
apply plugin: 'com.gtnewhorizons.retrofuturagradle'
apply from: rootProject.file('../gradle/common.gradle')

minecraft {
    mcVersion = project.property('mc_version')
    // 1.12.2: stable 39 (default); 1.7.10 sets mcp_version=12 in its target
    mcpMappingChannel = project.findProperty('mcp_channel') ?: 'stable'
    mcpMappingVersion = project.findProperty('mcp_version') ?: '39'
    username = 'Developer'
}

// 1.12.2 / 1.7.10 read .lang language files: generate them from the shared JSON files (common/src/main/resources/.../lang)
def langOut = layout.buildDirectory.dir('generated/legacylang')
def genLang = tasks.register('generateLegacyLang') {
    def whmRoot = new File(rootProject.projectDir, 'common').exists() ? rootProject.projectDir : rootProject.projectDir.parentFile
    def src = new File(whmRoot, 'common/src/main/resources/assets/whathitme/lang')
    def upper = project.findProperty('lang_upper') == 'true' // 1.7.10 uses en_US.lang
    inputs.dir(src)
    inputs.property('upper', upper)
    outputs.dir(langOut)
    doLast {
        def outDir = new File(langOut.get().asFile, 'assets/whathitme/lang')
        outDir.deleteDir()
        outDir.mkdirs()
        src.listFiles().findAll { it.name.endsWith('.json') }.each { f ->
            def map = new groovy.json.JsonSlurper().parse(f, 'UTF-8')
            def name = f.name.replace('.json', '.lang') // 1.12 uses lower-case names like en_us.lang
            if (upper) {
                def i = name.indexOf('_')
                if (i > 0) name = name.substring(0, i) + '_' + name.substring(i + 1, name.length() - 5).toUpperCase() + '.lang'
            }
            new File(outDir, name).withWriter('UTF-8') { w -> map.each { k, v -> w << "${k}=${v}\n" } }
        }
    }
}
processResources {
    dependsOn genLang
    from(langOut)
    // en_US.lang targets keep en_us.json: the core reads its English texts from en_us.json / en_us.lang (clients without the mod)
    def keepEnglishJson = project.findProperty('lang_upper') == 'true'
    exclude { it.path.startsWith('assets/whathitme/lang/') && it.name.endsWith('.json') && !(keepEnglishJson && it.name == 'en_us.json') }
}

// keep only the reobfuscated (production) jar in build/libs
tasks.named('jar') { destinationDirectory = layout.buildDirectory.dir('devlibs') }
tasks.named('reobfJar') { destinationDirectory = layout.buildDirectory.dir('libs') }
ext.whmProductionJar = 'reobfJar'

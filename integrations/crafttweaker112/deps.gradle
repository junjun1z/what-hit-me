// CraftTweaker 1.12.2 (ZenScript): compile only, never a dependency of the jar. Target property: crafttweaker_version
repositories { maven { url 'https://maven.blamejared.com' } }
dependencies {
    def v = project.property('crafttweaker_version')
    compileOnly("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${v}") { transitive = false }
    compileOnly("CraftTweaker2:CraftTweaker2-API:${v}") { transitive = false }
    compileOnly("CraftTweaker2:ZenScript:${v}") { transitive = false }
}

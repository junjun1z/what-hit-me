// KubeJS 6 API (Minecraft 1.19.2 - 1.20.1 Forge / Fabric, and the KubeJS 7 beta on NeoForge 1.20.4 that still has it):
// compile only, never a dependency of the jar. Target properties: kubejs_version, rhino_version
repositories { maven { url 'https://maven.latvian.dev/releases' } }
def kjsLoader = project.property('loader') == 'fabric' ? 'fabric' : project.property('loader') == 'neoforge' ? 'neoforge' : 'forge'
def kjsCfg = kjsLoader == 'neoforge' ? 'compileOnly' : 'modCompileOnly'
dependencies {
    add(kjsCfg, "dev.latvian.mods:kubejs-${kjsLoader}:${project.property('kubejs_version')}") { transitive = false }
    add(kjsCfg, "dev.latvian.mods:rhino-${kjsLoader}:${project.property('rhino_version')}") { transitive = false }
}

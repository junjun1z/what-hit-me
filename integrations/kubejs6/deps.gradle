// KubeJS 6 (Minecraft 1.18.2 - 1.20.1, Forge and Fabric): compile only, never a dependency of the jar.
// Target properties: kubejs_version, rhino_version (the loader is part of the artifact name)
repositories { maven { url 'https://maven.latvian.dev/releases' } }
def kjsLoader = project.property('loader') == 'fabric' ? 'fabric' : 'forge'
dependencies {
    modCompileOnly("dev.latvian.mods:kubejs-${kjsLoader}:${project.property('kubejs_version')}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-${kjsLoader}:${project.property('rhino_version')}") { transitive = false }
}

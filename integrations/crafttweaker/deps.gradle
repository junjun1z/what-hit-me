// CraftTweaker 8+ (new ZenScript, Minecraft 1.17.1 - 1.21.1): compile only, never a dependency of the jar.
// Used with crafttweaker8 (1.17.1) or crafttweaker9 (1.18.2+). Target property: crafttweaker_version
// (the loader and Minecraft version are part of the artifact name).
repositories { maven { url 'https://maven.blamejared.com' } }
dependencies {
    def lo = project.property('loader') as String
    def l = lo == 'fabric' ? 'fabric' : lo == 'neoforge' ? 'neoforge' : 'forge'
    // Loom / MDG legacy remap the jar; NeoForge and ForgeGradle 7 targets use Mojang names (only Player is referenced)
    def cfg = lo in ['neoforge', 'forge7', 'forge7_srg'] ? 'compileOnly' : 'modCompileOnly'
    add(cfg, "com.blamejared.crafttweaker:CraftTweaker-${l}-${project.property('mc_version')}:${project.property('crafttweaker_version')}") { transitive = false }
}

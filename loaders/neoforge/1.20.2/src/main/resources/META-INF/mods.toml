modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_homepage}"
logoFile = "assets/whathitme/icon.png"
description = '''${mod_description}'''
# Works on the client only, the server only or both: the server list never marks it as incompatible
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
mandatory = true
versionRange = "${loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"
